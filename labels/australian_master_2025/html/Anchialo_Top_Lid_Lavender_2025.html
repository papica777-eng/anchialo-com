<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;500;600;700;800&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  /* Physical dimensions: 8.6cm = 1016px x 1016px at 300 DPI */
  body {
    width: 1016px;
    height: 1016px;
    background: #EAE6DF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
  }
  .lid-circle {
    width: 980px;
    height: 980px;
    border-radius: 50%;
    background: #FFFFFF;
    position: relative;
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .ring-1 {
    position: absolute;
    top: 22px; left: 22px; right: 22px; bottom: 22px;
    border-radius: 50%;
    border: 2.5px solid #C5A059;
  }
  .ring-2 {
    position: absolute;
    top: 36px; left: 36px; right: 36px; bottom: 36px;
    border-radius: 50%;
    border: 1px dashed #6C58A3;
    opacity: 0.6;
  }
  .ring-3 {
    position: absolute;
    top: 46px; left: 46px; right: 46px; bottom: 46px;
    border-radius: 50%;
    border: 1px solid #C5A059;
    opacity: 0.5;
  }

  .curved-svg {
    position: absolute;
    top: 0; left: 0;
    width: 980px; height: 980px;
  }
  .curved-text-top {
    font-family: 'Montserrat', sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: 5px;
    fill: #222222;
  }
  .curved-text-bottom {
    font-family: 'Montserrat', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 5.5px;
    fill: #1A1A1A;
  }

  .lid-center {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 80px;
    font-weight: 700;
    letter-spacing: 18px;
    color: #1A1918;
    line-height: 1;
    margin-bottom: 24px;
  }

  .title-bar {
    background: #1C1B1A;
    color: #FFFFFF;
    padding: 16px 52px;
    border-radius: 4px;
    letter-spacing: 6px;
    font-size: 32px;
    font-weight: 700;
    border-top: 2px solid #C5A059;
    border-bottom: 2px solid #C5A059;
    margin-bottom: 18px;
  }

  .variant-pill {
    background: #6C58A3;
    color: #FFFFFF;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 4px;
    padding: 8px 30px;
    border-radius: 20px;
    margin-bottom: 22px;
  }

  .badge-oval {
    border: 1.5px solid #C5A059;
    background: linear-gradient(135deg, #FFF9EB 0%, #F5E8C8 100%);
    color: #4A3B1C;
    padding: 9px 30px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  <div class="lid-circle">
    <div class="ring-1"></div>
    <div class="ring-2"></div>
    <div class="ring-3"></div>

    <svg class="curved-svg" viewBox="0 0 980 980">
      <defs>
        <path id="topArcLid" d="M 140,490 A 350,350 0 0,1 840,490" fill="none"/>
        <path id="bottomArcLid" d="M 840,490 A 350,350 0 0,1 140,490" fill="none"/>
      </defs>
      <text class="curved-text-top">
        <textPath href="#topArcLid" startOffset="50%" text-anchor="middle">
          MAGNESIUM CHLORIDE &amp; MAGNESIUM SULFATE
        </textPath>
      </text>
      <text class="curved-text-bottom">
        <textPath href="#bottomArcLid" startOffset="50%" text-anchor="middle">
          NATURAL TOPICAL GEL · BLACK SEA LYE 300g
        </textPath>
      </text>
    </svg>

    <div class="lid-center">
      <div class="brand-logo">ANCHIALO</div>
      <div class="title-bar">DUAL MAGNESIUM COMPLEX</div>
      <div class="variant-pill">LAVENDER BLEND</div>
      <div class="badge-oval">NO PRESERVATIVES ADDED</div>
    </div>
  </div>
</body>
</html>
